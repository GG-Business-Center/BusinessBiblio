<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Business-Biblio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: url('background-image.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
        }
        .container h2 {
            color: gold;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .submit-btn {
            background-color: gold;
            color: black;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            width: 100%;
        }
        .submit-btn:hover {
            background-color: darkgoldenrod;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Se Connecter</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Adresse Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="input-group">
                <label for="pays">Pays</label>
                <select id="pays" name="pays" onchange="updatePlaceholderAndLimit()" required>
                  <option value="">-- Choisir un pays --</option>
                  <option value="226|8">Burkina Faso</option>
                  <option value="229|8">Bénin</option>
                  <option value="221|8">Sénégal</option>
                  <option value="225|10">Côte d'Ivoire</option>
                  <option value="228|8">Togo</option>
                  <option value="223|8">Mali</option>
                  <option value="+|10">Autre</option>
                </select>
              </div>
              
              <div class="input-group">
                <label for="numero">Numéro de Téléphone</label>
                <input type="tel" id="numero" name="numero" oninput="limiterSaisie()" required>
              </div>
            <button type="submit" class="submit-btn">Connexion</button>
        </form>
    </div>
    
    <script>
        let indicatifActuel = "";
        let longueurMax = 0;

  function updatePlaceholderAndLimit() {
    const pays = document.getElementById("pays").value;
    const numero = document.getElementById("numero");

    if (pays) {
      const [code, length] = pays.split("|");
      indicatifActuel = code;
      longueurMax = parseInt(length);

      // Appliquer l’indicatif et effacer les chiffres précédents
      numero.value = code;
      numero.placeholder = `ex: ${code}${"X".repeat(length)}`;
    } else {
      indicatifActuel = "";
      longueurMax = 0;
      numero.value = "";
      numero.placeholder = "ex: XXXXXXXX";
    }
  }

  function limiterSaisie() {
    const numero = document.getElementById("numero");

    // Empêche de supprimer ou modifier l’indicatif
    if (!numero.value.startsWith(indicatifActuel)) {
      numero.value = indicatifActuel;
    }

    // Récupère les chiffres après l’indicatif
    let chiffres = numero.value.slice(indicatifActuel.length);

    // Supprime les caractères non numériques
    chiffres = chiffres.replace(/\D/g, "");

    // Tronque si trop long
    if (chiffres.length > longueurMax) {
      chiffres = chiffres.slice(0, longueurMax);
    }

    // Mise à jour du champ
    numero.value = indicatifActuel + chiffres;
  }
    document.getElementById("loginForm").addEventListener("submit", async function(event) {
        event.preventDefault();
        const email = document.getElementById("email").value;
        const contact = document.getElementById("numero").value;

        const response = await fetch("/connexionq2w3e4r", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, contact })
        });

        const data = await response.json();
        if (data.success) {
            if (data.client.statutClient === "actif") {
                // Stockage des informations de l'utilisateur dans localStorage
                const client = {
                    email: email,
                    contact: contact,
                    solde: data.solde,
                    lienParrainage: data.lienParrainage
                };
                localStorage.setItem("client", JSON.stringify(client));

                // Redirection vers la page d'accueil
                window.location.href = "acceuil.html";
            } else {
                alert("Votre inscription n'a pas encore été validée.");
            }
        } else {
            alert(data.message);
        }
    });
</script>

</body>
</html>
