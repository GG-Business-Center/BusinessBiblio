<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique</title>
    <style>
        /* Global styles */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 2em;
            margin-bottom: 20px;
            color: #4CAF50;
        }

        /* Form Styles */
        .form-container {
            margin-bottom: 30px;
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .form-container label {
            font-size: 1.1em;
            margin-bottom: 8px;
            display: block;
        }

        .form-container input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
        }

        .form-container button {
            width: 100%;
            padding: 14px;
            background-color: #4CAF50;
            color: white;
            font-size: 1.1em;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .form-container button:hover {
            background-color: #45a049;
        }

        /* Results section */
        .results-container {
            margin-top: 30px;
            padding: 20px;
            background-color: #f1f1f1;
            border-radius: 8px;
        }

        .result {
            margin-bottom: 20px;
            background-color: #ffffff;
            padding: 15px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .result span {
            font-weight: bold;
            color: #4CAF50;
        }

        .no-results {
            text-align: center;
            color: #ff6f61;
            font-size: 1.2em;
        }

        /* Loader */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Consulter votre Historique</h1>

        <!-- Formulaire de saisie pour email et contact -->
        <div class="form-container">
            <form id="historiqueForm">
                <label for="email">Email:</label>
                <input type="email" id="email" required placeholder="Entrez votre email"><br>

                <label for="contact">Contact:</label>
                <input type="text" id="contact" required placeholder="Entrez votre contact"><br>

                <button type="submit">Voir l'historique</button>
            </form>
        </div>

        <!-- Section pour afficher les résultats -->
        <div class="results-container" id="resultsContainer">
            <!-- Résultats dynamiques seront affichés ici -->
        </div>
    </div>

    <script>
        // Gestion de l'envoi du formulaire et récupération des données
        document.getElementById('historiqueForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const contact = document.getElementById('contact').value;

            // Afficher le loader pendant l'appel API
            document.getElementById('resultsContainer').innerHTML = '<div class="loader"></div>';

            // Appel API pour récupérer l'historique
            fetch("/historique", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, contact })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // Si succès, afficher les résultats
                    const filleulsHTML = data.filleuls.length
                        ? data.filleuls.map(f => `<div class="result"><span>Nom :</span> ${f.nomComplet}</div>`).join('')
                        : '<div class="no-results">Aucun filleul trouvé</div>';

                    
                    const retraitsHTML = data.retraits.length
                        ? data.retraits.map(r => `<div class="result"><span>Montant:</span> ${r.montant} XOF <span>Status:</span> ${r.statut}</div>`).join('')
                        : '<div class="no-results">Aucun retrait effectué</div>';

                    document.getElementById('resultsContainer').innerHTML = `
                        <h2>Filleuls :</h2>
                        ${filleulsHTML}
                        <h2>Retraits :</h2>
                        ${retraitsHTML}
                    `;
                } else {
                    document.getElementById('resultsContainer').innerHTML = `<div class="no-results">${data.message}</div>`;
                }
            })
            .catch(err => {
                console.error('Erreur:', err);
                document.getElementById('resultsContainer').innerHTML = '<div class="no-results">Erreur lors de la récupération des données.</div>';
            });
        });
    </script>
</body>
</html>
