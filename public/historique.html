<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Historique</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f7f7f7; }
    h2 { color: #333; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 40px; background: white; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
    th { background: #4CAF50; color: white; }
  </style>
</head>
<body>

  <h2>Historique des filleuls</h2>
  <table id="filleulsTable">
    <thead>
      <tr>
        <th>Email</th>
        <th>Contact</th>
      </tr>
    </thead>
    <tbody>
      <!-- Filleuls JS -->
    </tbody>
  </table>

  <h2>Historique des retraits</h2>
  <table id="retraitsTable">
    <thead>
      <tr>
        <th>Montant</th>
        <th>Statut</th>
      </tr>
    </thead>
    <tbody>
      <!-- Retraits JS -->
    </tbody>
  </table>

  <script>
    // Exemple : récupère les infos du client depuis localStorage (ou autre méthode)
    const email = localStorage.getItem("email");
    const contact = localStorage.getItem("contact");
  
    if (!email || !contact) {
      alert("Connexion requise.");
      window.location.href = "connexion.html";
    }
  
    fetch("https://businessbiblio.onrender.com/historique", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        email: localStorage.getItem("email"),
        contact: localStorage.getItem("contact")
    })
})
.then(response => response.json())
.then(data => {
    if (data.success) {
        // afficher filleuls et retraits dans la page
        console.log("Filleuls :", data.filleuls);
        console.log("Retraits :", data.retraits);
    } else {
        alert("Impossible de récupérer les données");
    }
})
.catch(err => {
    console.error("Erreur réseau :", err);
    alert("Erreur lors de la récupération de l'historique");
});
  </script>  
</body>
</html>
