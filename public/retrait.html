<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrait</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: url('background-image.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .menu-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: gold;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            color: black;
            font-weight: bold;
        }
        .menu {
            display: none;
            position: absolute;
            top: 50px;
            left: 20px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        .menu a {
            display: block;
            padding: 5px;
            text-decoration: none;
            color: black;
        }

        .menu a:hover {
            background: lightgray;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 90%;
        }
        .input-box {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        .withdraw-btn {
            display: block;
            width: 100%;
            background: gold;
            border: none;
            padding: 15px;
            cursor: pointer;
            font-size: 20px;
            border-radius: 10px;
            text-decoration: none;
            color: black;
            font-weight: bold;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .withdraw-btn:hover {
            background: darkgoldenrod;
        }
    </style>
</head>
<body>
    <div class="menu-toggle" onclick="toggleMenu()">☰ Menu</div>
    <div class="menu" id="menu">
        <a href="retrait.html">Retrait</a>
        <a href="acceuil.html">Acceuil</a>
    </div>
    <div class="container">
        <h2>Retrait de fonds</h2>
        <input type="email" id="email" class="input-box" placeholder="Votre email">
        <input type="text" id="contact" class="input-box" placeholder="Votre contact">
        <input type="number" id="amount" class="input-box" placeholder="Montant à retirer">
        <button class="withdraw-btn" onclick="sendWithdrawalRequest()">Confirmer le retrait</button>
    </div>
         <footer style="margin-top: 40px; color: white; font-weight: bold; background-color: rgba(0, 0, 0, 0.6); padding: 10px 20px; border-radius: 10px;">
        Contactez-nous au email : businessbiblio@gmail.com
    </footer>

    <script>
        function toggleMenu() {
            let menu = document.getElementById("menu");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        }
        async function sendWithdrawalRequest() {
            const email = document.getElementById('email').value;
            const contact = document.getElementById('contact').value; // 🛠 Correction ici !
            const montant = document.getElementById('amount').value;
        
            if (!email || !contact || !montant) {
    alert("Veuillez remplir tous les champs.");
    return;
}

if (parseInt(montant) < 1000) {
    alert("Le montant minimum de retrait est de 1000 F CFA.");
    return;
}
        
            try {
    const response = await fetch('/retrait', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, contact, montant })
    });

    // ✅ Vérifier si le retrait a réussi
    if (response.ok) {
        alert("Retrait approuvé, vous serez rémunéré dans les 24 heures qui suivent.");

        // ✅ Attendre 2 secondes puis rediriger vers connexion.html
        setTimeout(() => {
            window.location.href = "/connexion.html";
        }, 2000);
    } else {
        const data = await response.json();
        alert(data.message || "Une erreur est survenue.");
    }
} catch (error) {
    console.error("Erreur lors du retrait", error);
    alert("Une erreur est survenue. Veuillez réessayer.");
}


        }
    </script>
</body>
</html>
